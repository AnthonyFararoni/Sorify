name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Sorify to do?
      description: Describe the feature and the situation where you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds, other tools, or "I can't".
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transcription quality or models
        - Output formats
        - Queue and files
        - Command line
        - Installer and updates
        - Other
